<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام باشگاه کاراته میلاد فرازمهر</title>
    <!-- اضافه کردن فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            /* اعمال فونت وزیرمتن */
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 8px;
        }

        .header p {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #38bdf8;
        }

        .btn-submit {
            width: 100%;
            background: #2563eb;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #1d4ed8;
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-telegram {
            display: block;
            width: 100%;
            text-align: center;
            background: transparent;
            border: 1px solid #0284c7;
            color: #38bdf8;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-decoration: none;
            margin-top: 12px;
            transition: background 0.2s;
        }

        .btn-telegram:hover {
            background: rgba(2, 132, 199, 0.1);
        }

        .alert-success {
            display: none;
            background: #064e3b;
            border: 1px solid #059669;
            color: #a7f3d0;
            padding: 14px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 16px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>باشگاه کاراته میلاد فرازمهر</h1>
            <p>فرم پیش‌ثبت‌نام و مشاوره رایگان</p>
        </div>

        <div id="successMessage" class="alert-success">
            ✅ اطلاعات شما با موفقیت ثبت شد! به زودی با شما تماس می‌گیریم.
        </div>

        <form id="karateForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="name">نام و نام خانوادگی</label>
                <input type="text" id="name" required placeholder="مثال: علی محمدی">
            </div>

            <div class="form-group">
                <label for="phone">شماره همراه</label>
                <input type="tel" id="phone" required placeholder="09xxxxxxxxx" pattern="[0-9]{10,11}">
            </div>

            <div class="form-group">
                <label for="age">سن (سال)</label>
                <input type="number" id="age" required min="4" max="80" placeholder="مثال: 16">
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">ثبت نام نهایی</button>
        </form>

        <a id="telegramLink" class="btn-telegram" href="https://t.me/milad_farazmehr" target="_blank">
            💬 پیام مستقیم در تلگرام
        </a>
    </div>

    <script>
        const GOOGLE_FORM_ACTION_URL = "https://docs.google.com/forms/d/e/1FAIpQLScFakPW1Xc3tmtAmYMJ40AomHUA6Y5ouw6aQDO3LDc-rUZxMA/formResponse";
        
        const ENTRY_NAME = "entry.1316565247";
        const ENTRY_PHONE = "entry.1361905981";
        const ENTRY_AGE = "entry.1805654657";

        async function handleSubmit(event) {
            event.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const successMsg = document.getElementById('successMessage');
            const nameVal = document.getElementById('name').value.trim();
            const phoneVal = document.getElementById('phone').value.trim();
            const ageVal = document.getElementById('age').value.trim();

            btn.disabled = true;
            btn.textContent = "در حال ارسال اطلاعات...";

            const formData = new FormData();
            formData.append(ENTRY_NAME, nameVal);
            formData.append(ENTRY_PHONE, phoneVal);
            formData.append(ENTRY_AGE, ageVal);

            try {
                await fetch(GOOGLE_FORM_ACTION_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: formData
                });

                successMsg.style.display = 'block';
                document.getElementById('karateForm').reset();
                
                const encodedMsg = encodeURIComponent(`سلام استاد فرازمهر،\nمن فرم ثبت‌نام را پر کردم.\nنام: ${nameVal}\nتلفن: ${phoneVal}\nسن: ${ageVal}`);
                document.getElementById('telegramLink').href = `https://t.me/milad_farazmehr?text=${encodedMsg}`;

            } catch (error) {
                alert("خطایی در ثبت اطلاعات رخ داد. لطفاً مجدداً تلاش کنید.");
            } finally {
                btn.disabled = false;
                btn.textContent = "ثبت نام نهایی";
            }
        }
    </script>
</body>
</html>
