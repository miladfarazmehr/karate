<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام باشگاه کاراته میلاد فرازمهر</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #f1f5f9;
            margin-bottom: 8px;
        }

        .header p {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: #38bdf8;
        }

        .btn-submit {
            width: 100%;
            background: #2563eb;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #1d4ed8;
        }

        .btn-telegram {
            display: block;
            width: 100%;
            text-align: center;
            background: transparent;
            border: 1px solid #0284c7;
            color: #38bdf8;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            text-decoration: none;
            margin-top: 12px;
        }

        .alert-success {
            display: none;
            background: #064e3b;
            border: 1px solid #059669;
            color: #a7f3d0;
            padding: 14px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>باشگاه کاراته میلاد فرازمهر</h1>
            <p>فرم پیش‌ثبت‌نام و مشاوره رایگان</p>
        </div>

        <div id="successMessage" class="alert-success">
            ✅ ثبت‌نام شما با موفقیت انجام شد!
        </div>

        <!-- iframe مخفی برای ارسال مستقیم بدون باز شدن صفحه گوگل -->
        <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) { showSuccess(); }"></iframe>

        <form id="karateForm" 
              action="https://docs.google.com/forms/d/e/1FAIpQLScFakPW1Xc3tmtAmYMJ40AomHUA6Y5ouw6aQDO3LDc-rUZxMA/formResponse" 
              method="POST" 
              target="hidden_iframe" 
              onsubmit="submitted=true;">
            
            <div class="form-group">
                <label for="name">نام و نام خانوادگی</label>
                <input type="text" id="name" name="entry.1316565247" required placeholder="مثال: علی محمدی">
            </div>

            <div class="form-group">
                <label for="phone">شماره همراه</label>
                <input type="tel" id="phone" name="entry.1361905981" required placeholder="09xxxxxxxxx">
            </div>

            <div class="form-group">
                <label for="age">سن (سال)</label>
                <input type="number" id="age" name="entry.1805654657" required min="4" max="80" placeholder="مثال: 16">
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">ثبت نام نهایی</button>
        </form>

        <a id="telegramLink" class="btn-telegram" href="https://t.me/milad_farazmehr" target="_blank">
            💬 ارسال پیام مستقیم در تلگرام
        </a>
    </div>

    <script>
        var submitted = false;

        function showSuccess() {
            document.getElementById('successMessage').style.display = 'block';
            document.getElementById('karateForm').reset();
            document.getElementById('submitBtn').textContent = "ثبت نام نهایی";
        }
    </script>
</body>
</html>
