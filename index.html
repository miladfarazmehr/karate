<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام باشگاه کاراته میلاد فرازمهر</title>
    <!-- فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 8px;
        }

        .header p {
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #38bdf8;
        }

        .btn-submit {
            width: 100%;
            background: #2563eb;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #1d4ed8;
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-telegram {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 14px;
            padding: 12px;
            background: #0284c7;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            text-align: center;
            box-sizing: border-box;
            transition: all 0.2s ease-in-out;
        }

        .btn-telegram:hover {
            background: #0369a1;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            transform: translateY(-1px);
        }

        .alert-success {
            display: none;
            background: #064e3b;
            border: 1px solid #059669;
            color: #a7f3d0;
            padding: 14px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 16px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <h1>باشگاه کاراته میلاد فرازمهر</h1>
            <p>فرم پیش‌ثبت‌نام و مشاوره رایگان</p>
        </div>

        <div id="successMessage" class="alert-success">
            ✅ اطلاعات شما با موفقیت ثبت شد! به زودی با شما تماس می‌گیریم.
        </div>

        <form id="karateForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="name">نام و نام خانوادگی</label>
                <input type="text" id="name" required placeholder="مثال: علی محمدی">
            </div>

            <div class="form-group">
                <label for="phone">شماره همراه</label>
                <input type="tel" id="phone" inputmode="numeric" required placeholder="۰۹۱۲۳۴۵۶۷۸۹">
            </div>

            <div class="form-group">
                <label for="age">سن (سال)</label>
                <input type="text" id="age" inputmode="numeric" required placeholder="مثال: ۱۶">
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">ثبت نام نهایی</button>
        </form>

        <a id="telegramLink" class="btn-telegram" href="tg://resolve?domain=milad_farazmehr">
            💬 ارسال پیام مستقیم در تلگرام
        </a>
    </div>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw_u8Yq5wLho7UHszqoBMXHqiKn9xsu3IliKlDy_iak7wwDScc4LdoSrE_YkMC8ZZm9/exec";

        // تابع تبدیل ارقام فارسی و عربی به ارقام انگلیسی
        function toEnglishDigits(str) {
            const persianDigits = [/۰/g, /۱/g, /۲/g, /۳/g, /۴/g, /۵/g, /۶/g, /۷/g, /۸/g, /۹/g];
            const arabicDigits  = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
            
            for (let i = 0; i < 10; i++) {
                str = str.replace(persianDigits[i], i).replace(arabicDigits[i], i);
            }
            return str;
        }

                async function handleSubmit(event) {
            event.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const successMsg = document.getElementById('successMessage');
            
            const nameVal = document.getElementById('name').value.trim();
            const phoneVal = toEnglishDigits(document.getElementById('phone').value.trim());
            const ageVal = toEnglishDigits(document.getElementById('age').value.trim());

            btn.disabled = true;
            btn.textContent = "در حال ارسال اطلاعات...";

            const formData = new URLSearchParams();
            formData.append('name', nameVal);
            formData.append('phone', phoneVal);
            formData.append('age', ageVal);

            try {
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData.toString()
                });

                successMsg.style.display = 'block';
                document.getElementById('karateForm').reset();
                
                // به‌روزرسانی متن و لینک تلگرام
                const msg = `سلام استاد فرازمهر،\nمن فرم ثبت‌نام را پر کردم.\nنام: ${nameVal}\nتلفن: ${phoneVal}\nسن: ${ageVal}`;
                document.getElementById('telegramLink').href = `tg://resolve?domain=milad_farazmehr&text=${encodeURIComponent(msg)}`;

            } catch (error) {
                alert("خطایی در ثبت اطلاعات رخ داد. لطفاً مجدداً تلاش کنید.");
            } finally {
                btn.disabled = false;
                btn.textContent = "ثبت نام نهایی";
            }
        }

    </script>
</body>
</html>
