<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فرم ثبت‌نام کاراته استاد میلاد فرازمهر</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Tahoma, Arial, sans-serif;
    background: radial-gradient(circle at 50% 0%, #262626 0%, #111111 55%, #0a0a0a 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: #ffffff;
    border-radius: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.55);
    width: 100%;
    max-width: 400px;
    overflow: hidden;
  }
  .header {
    background: #141414;
    padding: 34px 24px 24px;
    text-align: center;
    position: relative;
  }
  .belt-stripe {
    display: flex;
    height: 5px;
    width: 100%;
  }
  .belt-stripe span { flex: 1; }
  .belt-stripe span:nth-child(1) { background: #ffffff; }
  .belt-stripe span:nth-child(2) { background: #c81e1e; }
  .belt-stripe span:nth-child(3) { background: #111111; }
  .icon {
    width: 56px;
    height: 56px;
    margin: 0 auto 14px;
    display: block;
  }
  h1 {
    text-align: center;
    font-size: 19px;
    color: #ffffff;
    margin: 0;
    letter-spacing: 0.3px;
    font-weight: bold;
  }
  .subtitle {
    text-align: center;
    font-size: 12.5px;
    color: #9a9a9a;
    margin-top: 8px;
  }
  .body {
    padding: 26px 24px 30px;
  }
  label {
    display: block;
    font-size: 13.5px;
    color: #333333;
    margin-bottom: 7px;
    margin-top: 18px;
    font-weight: bold;
  }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 9px;
    border: 1.5px solid #e2e2e2;
    font-size: 15px;
    font-family: inherit;
    background: #fafafa;
    transition: border-color 0.15s, background 0.15s;
  }
  input:focus {
    outline: none;
    border-color: #c81e1e;
    background: #ffffff;
  }
  .error {
    color: #c81e1e;
    font-size: 12.5px;
    margin-top: 5px;
    display: none;
  }
  button {
    width: 100%;
    display: block;
    margin: 28px 0 0;
    padding: 15px;
    border: none;
    border-radius: 9px;
    background: #c81e1e;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.3px;
    transition: background 0.15s, transform 0.1s;
  }
  button:active { background: #a51818; transform: scale(0.99); }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <svg class="icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="32" r="29" stroke="#c81e1e" stroke-width="2.5"/>
      <path d="M24 15 L20 19 L14 24 L18 30 L22 27 L22 47 C22 48 23 49 24 49 L40 49 C41 49 42 48 42 47 L42 27 L46 30 L50 24 L44 19 L40 15 L32 21 Z" fill="#ffffff"/>
      <path d="M24 15 L32 21 L28 26 L22 19 Z" fill="#e6e6e6"/>
      <path d="M40 15 L32 21 L36 26 L42 19 Z" fill="#e6e6e6"/>
      <rect x="20" y="32" width="24" height="6" rx="1" fill="#c81e1e"/>
      <path d="M30 32 L28 40 M34 32 L36 40" stroke="#c81e1e" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <h1>فرم ثبت‌نام کلاس کاراته استاد میلاد فرازمهر</h1>
    <div class="subtitle">اطلاعات خود را وارد کنید</div>
  </div>
  <div class="belt-stripe"><span></span><span></span><span></span></div>

  <div class="body">
    <label for="name">نام و نام خانوادگی</label>
    <input type="text" id="name" placeholder="مثلاً: علی رضایی">
    <div class="error" id="err-name">لطفاً نام را وارد کنید</div>

    <label for="phone">شماره تلفن</label>
    <input type="tel" id="phone" placeholder="مثلاً: 09123456789">
    <div class="error" id="err-phone">لطفاً شماره تلفن را وارد کنید</div>

    <label for="age">سن</label>
    <input type="number" id="age" min="1" max="120" placeholder="مثلاً: 12">
    <div class="error" id="err-age">لطفاً سن را وارد کنید</div>

    <button onclick="sendToTelegram()">ارسال به مربی در تلگرام</button>
  </div>
</div>

<script>
function sendToTelegram() {
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const age = document.getElementById('age').value.trim();

  let valid = true;
  document.getElementById('err-name').style.display = name ? 'none' : 'block';
  document.getElementById('err-phone').style.display = phone ? 'none' : 'block';
  document.getElementById('err-age').style.display = age ? 'none' : 'block';
  if (!name) valid = false;
  if (!phone) valid = false;
  if (!age) valid = false;

  if (!valid) return;

  const message =
    'ثبت‌نام کلاس کاراته' + '\n' +
    'نام: ' + name + '\n' +
    'تلفن: ' + phone + '\n' +
    'سن: ' + age;

  const encoded = encodeURIComponent(message);
  const appUrl = 'tg://resolve?domain=milad_farazmehr&text=' + encoded;
  const webUrl = 'https://t.me/milad_farazmehr?text=' + encoded;

  window.location.href = appUrl;
  setTimeout(function () {
    window.location.href = webUrl;
  }, 1200);
}
</script>

</body>
</html>
